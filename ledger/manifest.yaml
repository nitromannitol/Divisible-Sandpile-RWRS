# RWRS frozen-statement manifest.
#
# One entry per frozen declaration.  The bytes between the FROZEN-STATEMENT
# markers are the contract: a proof attempt may fill in the proof after the end
# marker, never touch the statement.  `frozen_sha256` is the SHA-256 of exactly
# those bytes.
#
# States: DRAFT_SORRY (statement frozen, proof is a registered `sorry`),
#         FROZEN (a statement with no proof obligation here, such as a cited
#           result taken as a hypothesis),
#         SEALED (a proof exists and its axiom closure is clean).

