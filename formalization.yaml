version: "v0.4"

project:
  name: "Divisible-Sandpile-RWRS"
  description: >-
    A Lean 4 formalization of the paper "Divisible sandpiles via random walks in
    random scenery" of Bou-Rabee, Peres and Sava-Huss: explosion and
    stabilization for random walk in random scenery (Theorem 1.1), explosion of
    the divisible sandpile with i.i.d. initial masses on infinite
    bounded-degree graphs at mean above one and at mean one (Theorem 1.2), its
    stabilization below mean one under a moment condition (Theorem 1.3), and
    every other labelled statement of the paper, including the stationary and
    critical cases and the sharpness constructions.  Of the nine results the
    paper cites from the literature, eight are proved here and the ergodic
    decomposition of stationary random networks is an explicit hypothesis of
    the statements that use it.  The three main theorems are independently
    checked using the RWRSAudit/ comparator pairs.
  authors:
    - "Ahmed Bou-Rabee"
  license: "Apache-2.0"

sources:
  - title: "Divisible sandpiles via random walks in random scenery"
    authors:
      - "Ahmed Bou-Rabee"
      - "Yuval Peres"
      - "Ecaterina Sava-Huss"
    id: "arXiv:2604.13968"
    url: "https://arxiv.org/abs/2604.13968"
    type: "manuscript"
    relationship: "formalizes"
    note: >-
      The paper under formalization.  The text in paper/rwrs.tex is
      arXiv:2604.13968v1 with the corrections listed in
      paper/CHANGES_FROM_ARXIV.md.  Every labelled theorem, lemma, proposition
      and corollary is formalized; see status.scope for the precise scope
      boundary and fidelity.divergences for the readings of the paper's
      wording.
    license: ""                 # TODO(author): the license under which the paper is posted
    author_contacted: "n/a"     # the formalizer is an author of the source
    prior_work: ""

related_formalizations:
  - id: "https://github.com/nitromannitol/Lattice-Probability"
    relationship: "builds-on"
    note: >-
      Ahmed Bou-Rabee, Lattice-Probability (public Lean library, pinned git
      dependency at commit 9d44b4d4670df393bb86ac5a4e042f215001cddf).  It
      supplies the probability inequalities, the heat kernel estimates and the
      voltage function behind the cited results proved here.  It is a separate
      formalization by the same author, also written with AI models.

status:
  scope: >-
    A Lean 4 / Mathlib formalization of every labelled theorem, lemma,
    proposition and corollary of the paper: explosion and stabilization for
    random walk in random scenery (Theorem 1.1), explosion (Theorem 1.2) and
    stabilization (Theorem 1.3) of the divisible sandpile with i.i.d. initial
    masses on infinite connected graphs of bounded degree, the random walk
    representation of the odometer, the stationary and critical cases, and the
    sharpness constructions (the tree of pipes and the recurrent graphs of
    Section 8, moment sharpness, and the locally finite tree on which
    every integrable law stabilizes).  SCOPE BOUNDARY: the paper cites nine
    results from the literature, stated as propositions in RWRS/External/.
    Eight are proved outright in the repository, mostly through the shared
    library Lattice-Probability, in the generality every use site needs:
    von Bahr-Esseen, Fuk-Nagaev and Bernstein unconditionally, the
    bounded-degree heat kernel bound and heat kernel vanishing on every
    infinite connected graph, Efron-Stein for countable index sets, the
    pointwise Carne-Varopoulos bound on every connected, nontrivial, locally
    finite graph, and the bounded voltage function on every infinite connected
    graph, recurrent or transient
    (RWRS.External.voltageFunction_of_connected); each lives as a single
    SEALED theorem node together with its proof, and no statement carries it as
    a hypothesis.  One is not proved here: the ergodic decomposition of
    stationary random networks.  The statements whose proofs use it
    (RWRS.Frozen.stationaryPhase and RWRS.Frozen.zeroOneStationary) take it as
    an explicit hypothesis; ASSUMPTIONS.md lists it with its Lean statement.
    Not formalized: the open questions of Section 9, the proof ideas and
    related work of Sections 1.1 and 1.2, the example and remark environments,
    and the figures.  The main theorems are stated in full in
    RWRS/MainTheorems.lean; all three are additionally restated over a
    Mathlib-only vocabulary for the Lean comparator (RWRSAudit/).
  sorry_count: 0
  sorry_count_scope: "RWRS production library only"
  comparator_challenge_sorry_count: 3
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
  main_results:
    - declaration: "RWRS.optimalStopping"
      file: "RWRS/MainTheorems.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "RWRSAudit/OptimalStopping/comparator.json"
      literature_dependencies: []
    - declaration: "RWRS.explosion"
      file: "RWRS/MainTheorems.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "RWRSAudit/Explosion/comparator.json"
      literature_dependencies: []
    - declaration: "RWRS.stabilization"
      file: "RWRS/MainTheorems.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "RWRSAudit/Stabilization/comparator.json"
      literature_dependencies: []
    - declaration: "RWRSAudit.optimalStopping"
      file: "RWRSAudit/OptimalStopping/Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "RWRSAudit/OptimalStopping/comparator.json"
      literature_dependencies: []
    - declaration: "RWRSAudit.explosion"
      file: "RWRSAudit/Explosion/Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "RWRSAudit/Explosion/comparator.json"
      literature_dependencies: []
    - declaration: "RWRSAudit.stabilization"
      file: "RWRSAudit/Stabilization/Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "RWRSAudit/Stabilization/comparator.json"
      literature_dependencies: []

automation:
  methods:
    - method: "agent"
      models:
        - "Claude Opus 5.5"
        - "Claude Sonnet 5"
        - "Claude Opus 5"
        - "DeepSeek v4.1 Flash"
      framework: >-
        Claude Code (Anthropic) and the Pi agent harness, directing the models above; the author
        supervised the work and is responsible for the formalization.
      tool_setup: >-
        Lake builds under the pinned Lean toolchain and Mathlib revision. Every change is gated by
        the axiom-closure and warning-free-build checks, and the public CI runs the Mathlib-only
        comparator challenge/solution pairs against leanprover/comparator, lean4export and landrun
        at the revisions recorded in .github/workflows/.
      cost:
        spend_usd: "not separately tracked (subscription and API accounts)"
        hardware: "one Ubuntu workstation"
      prompting_notes: >-
        Human-directed agent work, closely supervised by the author. Statement differences from the
        paper are disclosed under fidelity.
fidelity:
  divergences: >-
    Where a Lean statement is a reading of the paper's wording,
    CORRESPONDENCE.md records it, including the frozen statements that carry a
    hypothesis of the paper their proof does not use, and the readings of
    prop:comb-estimates(d), lem:tr-good and cor:rec-loc.  Rendering conventions
    (not divergences): quantities the paper allows to be infinite (u_infinity,
    the Green function, sup_n S_n, the optimal stopping suprema, moments) take
    values in the extended nonnegative reals, and the extended mean in the
    extended reals, with the indeterminate case excluded by a hypothesis as in
    the paper; ball cardinalities are Set.encard; expectations at a bounded
    horizon are finite first-step averages of the walk; uniform constants are
    bound before the quantities they must not depend on.  Theorem 1.3 uses the
    cited displacement input in its pointwise Carne-Varopoulos form, proved
    outright, and its part (ii) derives the exit estimate it needs from that
    bound, a degree bound and volume growth at the origin.  The cited result
    that is not proved enters as a hypothesis whose Lean statement is in
    ASSUMPTIONS.md; that it renders the cited theorem faithfully is a reading,
    not a check.

review:
  status: "author-verified"
  reviewers:
    - "Ahmed Bou-Rabee"
  notes: >-
    Correctness of every proof is guaranteed by the Lean kernel and Mathlib (no
    sorry, no custom axiom).  The author decided the statement-level
    questions.  The statements were additionally audited by glm-5.3 against the
    paper, by a closure audit run with deepseek-v4.1-flash, which found no
    defect, and by an independent comparator-style audit run by gpt-6-astra.
    The paper in paper/rwrs.tex is arXiv:2604.13968v1 with the corrections
    listed in paper/CHANGES_FROM_ARXIV.md.  This is not external peer review.

alignment:
  namespace: "RWRS"
  statements:
    - source: "Theorem 1.1 (thm:OS)"
      lean: "RWRS.optimalStopping"
      module: "RWRS.MainTheorems"
      status: "proved"
      note: "Certified statement RWRS.Frozen.optimalStopping; the von Bahr-Esseen, Fuk-Nagaev and bounded-degree heat kernel results it uses are proved outright in RWRS/External/. Comparator challenge RWRSAudit/OptimalStopping/."
    - source: "Theorem 1.2 (thm:explosion)"
      lean: "RWRS.explosion"
      module: "RWRS.MainTheorems"
      status: "proved"
      note: "Certified statement RWRS.Frozen.explosion. Comparator challenge RWRSAudit/Explosion/."
    - source: "Theorem 1.3 (thm:stab)"
      lean: "RWRS.stabilization"
      module: "RWRS.MainTheorems"
      status: "proved"
      note: "Certified statement RWRS.Frozen.stabilization; the von Bahr-Esseen, Fuk-Nagaev, bounded-degree heat kernel and pointwise Carne-Varopoulos results it uses are proved outright in RWRS/External/. Comparator challenge RWRSAudit/Stabilization/."
    - source: "Every other labelled theorem, lemma, proposition and corollary"
      lean: "RWRS.Frozen.*"
      module: "RWRS.Frozen"
      status: "proved"
      note: "One registered statement per paper statement; the full map is CORRESPONDENCE.md."
    - source: "Cited results: von Bahr-Esseen, Fuk-Nagaev, Bernstein, bounded-degree heat kernel bound, heat kernel vanishing, Efron-Stein, pointwise Carne-Varopoulos bound"
      lean: "RWRS.External.*"
      module: "RWRS.External"
      status: "proved"
      note: "Theorems in RWRS/External/; the heat kernel ones on infinite connected graphs, Efron-Stein for countable index sets, the Carne-Varopoulos bound (RWRS.External.carneVaropoulos) unconditionally on every connected, nontrivial, locally finite graph."
    - source: "Cited result: the bounded voltage function (Lyons-Peres, Proposition 2.1)"
      lean: "RWRS.External.voltageFunction_of_connected"
      module: "RWRS.External.VoltageFunctionConnected"
      status: "proved"
      note: "Proved on every infinite connected graph; used inside the proofs of Theorems 1.1 and 1.2, which do not take it as a hypothesis."
    - source: "Cited result: ergodic decomposition of stationary random networks"
      lean: "RWRS.External.ErgodicDecomposition"
      module: "RWRS.External.ErgodicDecomposition"
      status: "assumed"
      note: "An explicit hypothesis of the statements that use it (RWRS.Frozen.stationaryPhase and RWRS.Frozen.zeroOneStationary); listed in ASSUMPTIONS.md."

acknowledgements: >-
  The paper is joint work with Yuval Peres and Ecaterina Sava-Huss.  Built on
  Lean 4, Mathlib, Lake, the shared library Lattice-Probability, and
  leanprover/comparator.
